name: Import reviewed Folio increment 2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'folio-openreader/folio-openreader.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=96fc59bc9ab7fb140003616d343fc6fbf3f2003e
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git diff --name-only "$base" HEAD)" = '.github/workflows/import-nov25-2.yml'
          asset="$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft and .name == "Reviewed Folio increment 2 transfer") | .assets[] | select(.state == "uploaded" and .name == "Folio-Nov25-Reviewed-Increment-2.zip" and .size == 34901) | .id] | first // empty')"
          test -n "$asset"
          zip="$RUNNER_TEMP/folio-review.zip"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset" -H 'Accept: application/octet-stream' > "$zip"
          printf '%s  %s\n' 31d558e9c711a773fabcc2485d0bc869a3492c11e63adf57492884520aab7980 "$zip" | sha256sum -c -
          unzip -oq "$zip"
          npm test
          git add -- ASSET-SHA256.txt dist/book-speech.js dist/neural-voices.js dist/sheet.js tests/neural-pause.test.mjs tests/sheet-dismissal.test.mjs tests/startup-budget.test.mjs
          test "$(git diff --cached --name-only | wc -l)" = 7
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve narration position and enable tapping to close reader panels'
          git push origin HEAD:main
