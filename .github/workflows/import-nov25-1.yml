name: Import reviewed Folio increment 1
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'folio-openreader/folio-openreader.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify and integrate the published-source changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=ec4e8586dced8d93b40f7ec3e1f71d00d0aa0c14
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git diff --name-only "$base" HEAD)" = '.github/workflows/import-nov25-1.yml'
          asset="$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft and .name == "Reviewed Folio increment 1 transfer") | .assets[] | select(.state == "uploaded" and .name == "Folio-Nov25-Reviewed-Increment-1.zip" and .size == 27614976) | .id] | first // empty')"
          test -n "$asset"
          zip="$RUNNER_TEMP/folio-review.zip"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset" -H 'Accept: application/octet-stream' > "$zip"
          printf '%s  %s\n' d5ab86bd5e1a0a6a1a188b4c0327e679158add941dad84b31b504b5de0030e8d "$zip" | sha256sum -c -
          unzip -oq "$zip"
          npm test
          git add -- ASSET-SHA256.txt README.md dist tests tools
          test "$(git diff --cached --name-only | wc -l)" = 45
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Improve Folio on desktop, OCR, practice, and reading voices'
          git push origin HEAD:main
